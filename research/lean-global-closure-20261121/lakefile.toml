name = "collatz_global_closure"
version = "0.1.0"
defaultTargets = ["CollatzGlobalClosure"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "CollatzGlobalClosure"

[[lean_lib]]
name = "CollatzBandSource"
srcDir = "vendor/pr173"
roots = ["ShellCover", "ForwardSection", "SectionDynamics", "RisingReturns"]

[[lean_lib]]
name = "CollatzWitnessSource"
srcDir = "vendor/pr177"
roots = ["Collatz.ReverseBasin146", "Collatz.Closure", "Collatz.Witness", "Collatz.DirectedInduction", "Collatz.WitnessEnergy", "Collatz.SourceWitness", "Collatz.GapMultiset", "Collatz.UnboundedGapReset"]

[[lean_lib]]
name = "CollatzGlobalClosureCore"
