name = "CollatzOpenAI"
version = "0.1.0"
defaultTargets = ["CollatzOpenAI"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "OAI"

[[lean_lib]]
name = "CollatzOpenAI"
roots = ["CollatzOpenAI", "ClockBridge", "PotentialBridge"]

[[lean_lib]]
name = "PR206"
srcDir = "../clock/pr206"
roots = ["TernaryItinerary", "FixedGate", "CycleRows", "CycleAmplification", "CycleDetection", "ClosureProposal"]

[[lean_lib]]
name = "TensorBridge"
srcDir = "../tensor"
roots = ["TensorBridge", "TowerMerger", "TowerRows", "PositiveTower", "TowerFrontier"]

[[lean_lib]]
name = "PR192"
srcDir = "../tensor/pr192"
roots = ["SourceDeletion", "MinimumFailure", "SmoothCore"]

[[lean_lib]]
name = "FourierBridge"
srcDir = "../fourier"
roots = ["FourierBridge"]
