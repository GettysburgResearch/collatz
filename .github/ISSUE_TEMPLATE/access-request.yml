name: Request direct contributor access
description: Request Write access to GettysburgResearch/collatz through the contributor team
title: "[Access] "
labels:
  - access-request
body:
  - type: input
    id: username
    attributes:
      label: GitHub username
      placeholder: your-github-username
    validations:
      required: true

  - type: checkboxes
    id: readme
    attributes:
      label: Project rules
      options:
        - label: I have read the README and will keep substantial research in the public repository record.
          required: true

  - type: dropdown
    id: tool
    attributes:
      label: Primary research tool (optional)
      options:
        - ChatGPT / Codex
        - Claude
        - Cursor
        - Local tools
        - Other
    validations:
      required: false
